<!DOCTYPE html>
<html>
<head>
  <title>YouTube Fullscreen</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: black;
    }
  </style>
</head>
<body>
  <iframe
    src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
