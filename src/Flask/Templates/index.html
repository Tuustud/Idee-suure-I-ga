<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kruudid</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .corner-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 12px 18px;
            border: 2px solid white;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 16px;
            cursor: pointer;
        }

        .corner-button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline loop>
        <source src="{{ url_for('static', filename='kruudid.mp4') }}" type="video/mp4">
        Sinu brauser ei toeta videot.
    </video>

    <a class="corner-button" href="{{ url_for('free_time') }}">Vaba aeg</a>

    <script>
        const video = document.getElementById("video");

        // Proovib videot automaatselt käivitada
        video.play().catch(() => {
            console.log("Autoplay blokeeriti.");
        });

        // Esimese hiirekliki korral lülitab heli sisse
        document.addEventListener("click", () => {
            video.muted = false;
            video.play();
        }, { once: true });
    </script>

</body>
</html>
