<!DOCTYPE html>
<html>
<head>
  <title>YouTube Fullscreen</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: black;
    }
  </style>
</head>

<body>
  <iframe
    src="https://www.youtube.com/embed/rnZorHI_Y28?si=t0cwlxaSPPttQtnj"
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>
</body>
</html>
